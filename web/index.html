<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b6b3a">
  <meta name="description" content="Alle Buslinien im VVS: Linien, Haltestellen, Abfahrten, Verbindungen und Karte.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>VVS Bus</title>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>VVS Bus</h1>
    <div id="status">Lade Fahrplandaten …</div>
  </header>

  <main>
    <section id="tab-lines" class="tab active">
      <input id="line-q" type="search" placeholder="Linie suchen (z. B. 92 oder Waiblingen)" autocomplete="off" aria-label="Linie suchen">
      <div id="line-filters" class="filters">
        <select id="kreis-sel" aria-label="Landkreis"><option value="">Alle Landkreise</option></select>
        <select id="ride-sel" aria-label="Filter">
          <option value="all">Alle Linien</option>
          <option value="todo">Noch nicht gefahren</option>
          <option value="done">Schon gefahren</option>
        </select>
      </div>
      <div id="progress" class="progress" hidden></div>
      <div id="line-detail" hidden></div>
      <div id="line-list" class="list"></div>
      <div class="backup">
        <button id="rides-export" type="button" class="small">Gefahrene Linien sichern</button>
        <button id="rides-import" type="button" class="small">Sicherung laden</button>
        <input id="rides-file" type="file" accept="application/json,.json" hidden>
      </div>
      <p class="info" id="info"></p>
    </section>

    <section id="tab-stops" class="tab">
      <div id="stop-search">
        <input id="stop-q" type="search" placeholder="Haltestelle suchen" autocomplete="off" aria-label="Haltestelle suchen">
        <button id="near-btn" type="button" class="secondary">In meiner Nähe</button>
        <div id="stop-results" class="list"></div>
      </div>
      <div id="stop-detail" hidden></div>
    </section>

    <section id="tab-trip" class="tab">
      <div class="field">
        <label for="from-q">Von</label>
        <input id="from-q" type="text" placeholder="Start-Haltestelle" autocomplete="off">
        <div class="suggest" id="from-s" hidden></div>
      </div>
      <button id="swap" type="button" class="secondary swap" aria-label="Start und Ziel tauschen">⇅ Tauschen</button>
      <div class="field">
        <label for="to-q">Nach</label>
        <input id="to-q" type="text" placeholder="Ziel-Haltestelle" autocomplete="off">
        <div class="suggest" id="to-s" hidden></div>
      </div>
      <div class="when">
        <div class="field"><label for="trip-date">Datum</label><input id="trip-date" type="date"></div>
        <div class="field"><label for="trip-time">Abfahrt ab</label><input id="trip-time" type="time"></div>
      </div>
      <button id="trip-go" type="button" class="primary">Verbindungen suchen</button>
      <div id="trip-results"></div>
    </section>

    <section id="tab-map" class="tab">
      <div id="map"></div>
    </section>
  </main>

  <nav id="tabs" aria-label="Bereiche">
    <button type="button" data-tab="lines" class="on"><span>🚌</span>Linien</button>
    <button type="button" data-tab="stops"><span>🚏</span>Halte</button>
    <button type="button" data-tab="trip"><span>🧭</span>Verbindung</button>
    <button type="button" data-tab="map"><span>🗺️</span>Karte</button>
  </nav>

  <script src="vendor/leaflet.js"></script>
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
